services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vkr_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./resources:/code/resources
      - ./alembic:/code/alembic
      - ./alembic.ini:/code/alembic.ini
      - vkr_storage:/tmp/vkr_storage
    environment:
      - PROJECT_NAME=VKR Checker
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/vkr_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - GOTENBERG_URL=http://gotenberg:3000
      - MAX_FILE_SIZE_MB=50
      - TEMP_STORAGE_PATH=/tmp/vkr_storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vkr_worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    volumes:
      - ./app:/code/app
      - ./resources:/code/resources
      - ./alembic:/code/alembic
      - ./alembic.ini:/code/alembic.ini
      - vkr_storage:/tmp/vkr_storage
    environment:
      - PROJECT_NAME=VKR Checker
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/vkr_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - GOTENBERG_URL=http://gotenberg:3000
      - MAX_FILE_SIZE_MB=50
      - TEMP_STORAGE_PATH=/tmp/vkr_storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: vkr_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vkr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vkr_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vkr_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: vkr_gotenberg

volumes:
  postgres_data:
  redis_data:
  vkr_storage:
